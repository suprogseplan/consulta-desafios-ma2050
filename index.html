<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Consulta Desafios e Diretrizes MA 2050</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: faixa institucional + abas fixas; cada área é uma coluna de fichas de desafio com a cadeia passivo→desafio / ativo→diretriz */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#14223A; --muted:#58657A; --line:#D8DFE8;
  --brand:#163C6B; --brand-ink:#FFFFFF; --teal:#13879B; --gold:#C98A12; --red:#B23A2E; --green:#2E7D4F;
  --edu:#C98A12; --eco:#1F5FA8; --amb:#2E7D4F; --soc:#B23A2E; --gov:#4B4FA6;
  --passivo-bg:#FBEDEB; --passivo-ink:#8E2A20; --ativo-bg:#E6F4F1; --ativo-ink:#0E6B5C;
  --focus:#13879B; --mast:#163C6B; --mast-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162131; --surface-2:#1C2A3D; --ink:#E6ECF4; --muted:#9BA8BB; --line:#2B3A50;
  --brand:#7FB0E6; --brand-ink:#0E1520; --teal:#4CC0D2; --gold:#E3AC45; --red:#E2786B; --green:#6CC08F;
  --edu:#E3AC45; --eco:#6EA6EA; --amb:#6CC08F; --soc:#E2786B; --gov:#9B9EF0;
  --passivo-bg:#3A1F1E; --passivo-ink:#F2B2A8; --ativo-bg:#14332E; --ativo-ink:#8FDCCB; --focus:#4CC0D2; --mast:#132A4A; --mast-ink:#E6ECF4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162131; --surface-2:#1C2A3D; --ink:#E6ECF4; --muted:#9BA8BB; --line:#2B3A50;
  --brand:#7FB0E6; --brand-ink:#0E1520; --teal:#4CC0D2; --gold:#E3AC45; --red:#E2786B; --green:#6CC08F;
  --edu:#E3AC45; --eco:#6EA6EA; --amb:#6CC08F; --soc:#E2786B; --gov:#9B9EF0;
  --passivo-bg:#3A1F1E; --passivo-ink:#F2B2A8; --ativo-bg:#14332E; --ativo-ink:#8FDCCB; --focus:#4CC0D2; --mast:#132A4A; --mast-ink:#E6ECF4; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
p{margin:0}
.code{font-family:var(--f-mono);font-size:.78em;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* faixa */
.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{padding-block:22px 20px;display:grid;gap:6px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:.85rem;opacity:.85}
.mast h1{font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.05}
.mast p{max-width:68ch;opacity:.92}

/* abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-block:6px}
.tab{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:6px;font-family:var(--f-display);font-size:1rem;font-weight:600;letter-spacing:.03em;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--tc,var(--brand))}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--tc,var(--brand))}
.tab .cnt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:500}

main .wrap{padding-block:24px 64px;display:grid;gap:22px}
main .wrap>*,.view>*,.card-b>*,.q>*,.lac>*{min-width:0}
.view{display:grid;gap:22px}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:1.45rem}
.lead{color:var(--muted);max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}

/* cadeia lógica */
.chain{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:8px}
.chain .node{border-radius:8px;padding:12px;display:grid;gap:4px;align-content:start}
.chain .node b{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.03em;text-transform:uppercase}
.chain .node span{font-size:.9rem}
.chain .arr{align-self:center;font-family:var(--f-display);font-size:1.6rem;color:var(--muted)}
.n-pas{background:var(--passivo-bg);color:var(--passivo-ink)}
.n-atv{background:var(--ativo-bg);color:var(--ativo-ink)}
.n-des{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.n-dir{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.n-prj{background:var(--brand);color:var(--brand-ink)}
@media (max-width:640px){.chain{grid-template-columns:1fr}.chain .arr{transform:rotate(90deg);justify-self:center;line-height:1}}

/* legenda de situação */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.sit{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.sit-persiste{color:var(--red)} .sit-avanco{color:var(--green)} .sit-ampliar{color:var(--gold)} .sit-oportunidade{color:var(--teal)}

/* formulário */
label.f{display:grid;gap:4px;font-weight:600;font-size:.92rem;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.req{color:var(--red)}

/* área */
.vision{border-left:6px solid var(--ac);background:var(--surface);border-radius:10px;padding:18px 20px;display:grid;gap:6px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.vision .eyebrow{color:var(--ac);opacity:1}
.vision h2{font-size:1.7rem}
.vision q{font-style:italic;max-width:70ch;quotes:none}

/* ficha do desafio */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card-h{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:start}
.dnum{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1;color:var(--ac);min-width:2ch;text-align:right}
.card-h h3{font-size:1.5rem;line-height:1.15}
.dlabel{color:var(--ac);opacity:1;font-size:.82rem;font-weight:600}
.reading b .sit{margin-left:8px;vertical-align:1px;font-family:var(--f-body);font-size:.72rem}
.card-h .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.done-mark{font-size:.78rem;color:var(--green);font-weight:700}
.card-b{padding:16px 20px;display:grid;gap:18px}
.reading{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:.95rem}
.reading b{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--muted);display:block;margin-bottom:2px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.links{grid-template-columns:1fr}}
.links h4,.sec-h{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;border-radius:6px;padding:7px 10px;font-size:.9rem}
.chip .code{font-weight:500}
.chip small{display:block;font-size:.8rem;opacity:.85}
.chip.p{background:var(--passivo-bg);color:var(--passivo-ink)}
.chip.a{background:var(--ativo-bg);color:var(--ativo-ink)}
.none{font-size:.88rem;color:var(--muted);font-style:italic}

.dir{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.dir:first-of-type{border-top:0;padding-top:0}
.dir-t{display:grid;grid-template-columns:auto 1fr;gap:10px}
.dir-t .code{color:var(--muted);padding-top:2px}
.q{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:14px}
.q-l{font-weight:700;font-size:.95rem}

.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:7px 12px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:not([aria-pressed="true"]):hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button[data-v="excluir"][aria-pressed="true"]{background:var(--red);color:#fff}
.scale button{min-width:40px}

.props{display:grid;gap:6px;font-size:.9rem}
.props li{display:grid;grid-template-columns:1fr auto;gap:10px}
.props ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.props .org{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
details.more summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:.9rem}

.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.82rem;display:inline-flex;gap:6px;align-items:baseline}
.pick button .code{font-size:.72rem}
.pick button[aria-pressed="true"].pp{background:var(--passivo-bg);color:var(--passivo-ink);border-color:currentColor}
.pick button[aria-pressed="true"].pa{background:var(--ativo-bg);color:var(--ativo-ink);border-color:currentColor}

/* lacunas */
.lac{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 18px;display:grid;gap:10px;border-left:5px solid var(--ac)}
.lac h3{font-size:1.2rem}
.lac .ctx{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.mini{border-radius:4px;padding:2px 7px;font-family:var(--f-mono);font-size:.74rem}
.mini.p{background:var(--passivo-bg);color:var(--passivo-ink)} .mini.a{background:var(--ativo-bg);color:var(--ativo-ink)} .mini.d{background:var(--surface-2);color:var(--ink)}
.novo{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;background:var(--surface)}
.novo-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 14px;font-weight:700}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--red);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:.92rem;color:var(--muted)}
.status.ok{color:var(--green)} .status.err{color:var(--red)}

/* tabelas de referência */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:right}

/* consolidação */
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface-2);min-width:120px}
.bar span{display:block;height:100%}
.b-manter{background:var(--green)} .b-ajustar{background:var(--gold)} .b-fundir{background:var(--teal)} .b-excluir{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.quote{border-left:3px solid var(--line);padding:4px 10px;font-size:.9rem}
.quote cite{display:block;font-style:normal;font-size:.78rem;color:var(--muted)}
.kpis{display:flex;flex-wrap:wrap;gap:24px}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1}
.kpi span{font-size:.85rem;color:var(--muted)}
.foot-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.seg button,.tab,.btn{transition:background-color .12s,color .12s}}
</style>
</head>

function startConsol(){
  if(!db || unsub) { drawConsol(); return; }
  const t = setTimeout(()=>{ const s=document.getElementById('c-status'); if(s) s.textContent='As respostas ainda não puderam ser carregadas.'; },10000);
  unsub = db.collection('respostas').onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(t);
    ALL = snap.docs.filter(x=>x.exists).map(x=>x.data()); drawConsol();
  }, err=>{ clearTimeout(t); const s=document.getElementById('c-status'); if(s){ s.className='status err'; s.textContent='Não foi possível ler as respostas ('+err.code+').'; } });
}
function drawConsol(){
  const k = document.getElementById('c-kpis'); if(!k) return;
  const cams = new Set(ALL.map(r=>r.ident?.camara).filter(Boolean));
  const insts = new Set(ALL.map(r=>(r.ident?.inst||'').trim().toLowerCase()).filter(Boolean));
  const nNovos = ALL.reduce((s,r)=>s+(r.novos||[]).filter(n=>n.t).length,0);
  k.innerHTML = [[ALL.length,'respostas'],[insts.size,'instituições'],[cams.size,'Câmaras representadas'],[nNovos,'desafios novos propostos']].map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('');
  document.getElementById('c-des').innerHTML = DATA.desafios.map(d=>{
    const c={manter:0,ajustar:0,fundir:0,excluir:0}; let rs=0,rn=0,sug=0;
    ALL.forEach(r=>{ const x=r.d?.[d.n]; if(!x) return; if(c[x.av]!=null) c[x.av]++; if(x.rel){rs+=+x.rel;rn++;} if(x.red) sug++; if(x.nd) sug++; Object.values(x.dir||{}).forEach(z=>{ if(z.txt) sug++; }); });
    const n = c.manter+c.ajustar+c.fundir+c.excluir;
    const bar = n?Object.entries(c).map(([kk,v])=>v?`<span class="b-${kk}" style="width:${v/n*100}%" title="${kk}: ${v}"></span>`:'').join(''):'';
    return `<tr><td><span class="code">D${d.n}</span> ${esc(short(d.t))}</td><td><div class="bar">${bar}</div></td><td class="num">${n}</td><td class="num">${rn?(rs/rn).toFixed(1):'–'}</td><td class="num">${sug}</td></tr>`;
  }).join('');
  document.getElementById('c-lac').innerHTML = DATA.lacunas.map(l=>{
    const c={novo_desafio:0,nova_diretriz:0,contemplado:0}; ALL.forEach(r=>{ const o=r.lac?.[l.id]?.op; if(c[o]!=null) c[o]++; });
    return `<tr><td>${esc(l.t)}</td><td class="num">${c.novo_desafio}</td><td class="num">${c.nova_diretriz}</td><td class="num">${c.contemplado}</td></tr>`;
  }).join('');
  const items=[];
  ALL.forEach(r=>{
    const who = `${r.ident?.nome||'Sem nome'} · ${r.ident?.inst||''}`;
    (r.novos||[]).filter(n=>n.t).forEach(n=>items.push(`<div class="quote"><b>Novo desafio:</b> ${esc(n.t)}${n.dir?`<br><b>Diretrizes:</b> ${esc(n.dir)}`:''}${(n.pas||[]).length?`<br><b>Passivos:</b> ${n.pas.join(', ')}`:''}${(n.atv||[]).length?` · <b>Ativos:</b> ${n.atv.join(', ')}`:''}<cite>${esc(who)}</cite></div>`));
    Object.entries(r.d||{}).forEach(([dn,x])=>{ if(x.nd) items.push(`<div class="quote"><b>Nova diretriz para D${dn}:</b> ${esc(x.nd)}<cite>${esc(who)}</cite></div>`); });
  });
  document.getElementById('c-novos').innerHTML = items.length?items.join(''):'<p class="none">Nenhuma proposta textual ainda.</p>';
}
function csv(){
  const rows=[['nome','instituicao','camara','tipo','item','avaliacao','texto','relevancia','ativos']];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  ALL.forEach(r=>{
    const base=[r.ident?.nome,r.ident?.inst,r.ident?.camara];
    Object.entries(r.d||{}).forEach(([dn,x])=>{
      if(x.av||x.red||x.rel) rows.push([...base,'desafio','D'+dn,x.av,x.red,x.rel,'']);
      Object.entries(x.dir||{}).forEach(([i,z])=>{ if(z.a||z.txt) rows.push([...base,'diretriz',`D${dn}.${+i+1}`,z.a,z.txt,'','']); });
      if(x.nd) rows.push([...base,'nova_diretriz','D'+dn,'',x.nd,'',(x.nda||[]).join(' ')]);
    });
    Object.entries(r.lac||{}).forEach(([id,l])=>{ if(l.op||l.txt) rows.push([...base,'lacuna',id,l.op,l.txt,'','']); });
    (r.novos||[]).forEach(n=>{ if(n.t) rows.push([...base,'novo_desafio',n.area,(n.pas||[]).join(' '),`${n.t} | Diretrizes: ${n.dir||''} | Evidência: ${n.ev||''} | Instituições: ${n.inst||''}`,'',(n.atv||[]).join(' ')]); });
    if(r.geral) rows.push([...base,'geral','','',r.geral,'','']);
  });
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

/* ---------- itens para a planilha ---------- */
function itensDe(r){
  const out=[]; const lab=(arr,v)=>(arr.find(x=>x[0]===v)||[,v||''])[1];
  Object.entries(r.d||{}).forEach(([dn,x])=>{
    const d=DES[+dn]; if(!d) return;
    if(x.av||x.red||x.rel) out.push(['desafio','D'+dn,d.t,lab(AV_D,x.av),x.red||'',x.rel||'','']);
    Object.entries(x.dir||{}).forEach(([i,z])=>{ if(z.a||z.txt) out.push(['diretriz',`D${dn}.${+i+1}`,d.dir[+i]||'',lab(AV_R,z.a),z.txt||'','','']); });
    if(x.nd||(x.nda||[]).length) out.push(['nova_diretriz','D'+dn,d.t,'',x.nd||'','',(x.nda||[]).join(' ')]);
  });
  Object.entries(r.lac||{}).forEach(([id,l])=>{ const g=DATA.lacunas.find(z=>z.id===id); if(g&&(l.op||l.txt)) out.push(['lacuna',id,g.t,lab(LAC_OP,l.op),l.txt||'','','']); });
  (r.novos||[]).forEach((n,i)=>{ if(n.t) out.push(['novo_desafio','N'+(i+1)+(n.area?'-'+n.area:''),n.t,(n.pas||[]).join(' '),`Diretrizes: ${n.dir||''} | Evidência: ${n.ev||''} | Instituições: ${n.inst||''}`,'',(n.atv||[]).join(' ')]); });
  if(r.geral) out.push(['geral','','Considerações gerais','',r.geral,'','']);
  return out;
}

  DATA.areas.forEach(a=>{
    const ds = DATA.desafios.filter(d=>d.area===a.id && R.d[d.n]); if(!ds.length) return;
    L.push('== '+a.nome.toUpperCase());
    ds.forEach(d=>{ const x=R.d[d.n];
      L.push(`D${d.n}. ${d.t}`);
      if(x.av) L.push(`  Desafio: ${lab(AV_D,x.av)}${x.red?' — '+x.red:''}`);
      if(x.rel) L.push(`  Relevância 2050: ${x.rel}/5`);
      Object.entries(x.dir||{}).forEach(([i,z])=>{ if(z.a) L.push(`  Diretriz ${d.n}.${+i+1}: ${lab(AV_R,z.a)}${z.txt?' — '+z.txt:''}`); });
      if(x.nd) L.push(`  Nova diretriz: ${x.nd}${(x.nda||[]).length?' (ativos: '+x.nda.join(', ')+')':''}`);
    }); L.push('');
  });
  const lk = Object.entries(R.lac).filter(([,l])=>l.op);
  if(lk.length){ L.push('== LACUNAS PRELIMINARES'); lk.forEach(([id,l])=>{ const g=DATA.lacunas.find(x=>x.id===id); L.push(`${g.t}: ${lab(LAC_OP,l.op)}${l.txt?' — '+l.txt:''}`); }); L.push(''); }
  const nv = R.novos.filter(n=>n.t);
  if(nv.length){ L.push('== NOVOS DESAFIOS'); nv.forEach((n,i)=>{ L.push(`${i+1}. ${n.t} [${AREA[n.area]?.curto||''}]`); if((n.pas||[]).length) L.push('   Passivos: '+n.pas.join(', ')); if(n.ev) L.push('   Evidência: '+n.ev); if(n.dir) L.push('   Diretrizes: '+n.dir); if((n.atv||[]).length) L.push('   Ativos: '+n.atv.join(', ')); if(n.inst) L.push('   Instituições: '+n.inst); }); L.push(''); }
  if(R.geral){ L.push('== CONSIDERAÇÕES GERAIS', R.geral); }
  return L.join('\n');
}

/* ---------- contagens ---------- */
function updateCounts(){
  DATA.areas.forEach(a=>{
    const ds=DATA.desafios.filter(d=>d.area===a.id); const done=ds.filter(d=>R.d[d.n]?.av).length;
    const el=document.getElementById('cnt-'+a.id); if(el) el.textContent=`${done}/${ds.length}`;
  });
  DATA.desafios.forEach(d=>{ const el=document.getElementById('ok-'+d.n); if(el) el.hidden=!R.d[d.n]?.av; });
  const tb=document.getElementById('resumo');
  if(tb){
    tb.innerHTML = DATA.areas.map(a=>{
      const ds=DATA.desafios.filter(d=>d.area===a.id);
      const nd=ds.filter(d=>R.d[d.n]?.av).length;
      const tot=ds.reduce((s,d)=>s+d.dir.length,0);
      const nr=ds.reduce((s,d)=>s+Object.values(R.d[d.n]?.dir||{}).filter(z=>z.a).length,0);
      const nn=ds.filter(d=>R.d[d.n]?.nd).length;
      return `<tr><td>${esc(a.nome)}</td><td class="num">${nd} de ${ds.length}</td><td class="num">${nr} de ${tot}</td><td class="num">${nn}</td></tr>`;
    }).join('');
    const nl=Object.values(R.lac).filter(l=>l.op).length, nv=R.novos.filter(n=>n.t).length;
    document.getElementById('resumo-lac').textContent = `Lacunas avaliadas: ${nl} de ${DATA.lacunas.length}. Desafios novos propostos: ${nv}.`;
  }
}

/* ---------- sincronização de controles ---------- */
function syncSeg(root=document){
  root.querySelectorAll('button[data-k][data-v]').forEach(b=>b.setAttribute('aria-pressed', String(getP(b.dataset.k))===b.dataset.v?'true':'false'));
  root.querySelectorAll('button[data-k][data-toggle]').forEach(b=>{ const a=getP(b.dataset.k)||[]; b.setAttribute('aria-pressed', a.includes(b.dataset.toggle)?'true':'false'); });
}
function syncShow(root=document){
  root.querySelectorAll('[data-show]').forEach(el=>{ el.hidden = !el.dataset.when.split(',').includes(String(getP(el.dataset.show)??'')); });
}
function hydrate(root){
  root.querySelectorAll('input[data-k],textarea[data-k],select[data-k]').forEach(el=>{ const v=getP(el.dataset.k); el.value = v==null?'':v; });
  syncSeg(root); syncShow(root);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.view){ location.hash = t.dataset.view; return; }
  if(t.dataset.k && t.dataset.v!=null){ const cur=getP(t.dataset.k); setP(t.dataset.k, cur===t.dataset.v?'':t.dataset.v); changed(); return; }
  if(t.dataset.k && t.dataset.toggle){ const a=(getP(t.dataset.k)||[]).slice(); const i=a.indexOf(t.dataset.toggle); i<0?a.push(t.dataset.toggle):a.splice(i,1); setP(t.dataset.k,a); changed(); return; }
  if(t.id==='add-novo'){ R.novos.push({area:'',t:'',pas:[],ev:'',dir:'',atv:[],inst:''}); renderNovos(); changed(); return; }
  if(t.dataset.rm!=null){ R.novos.splice(+t.dataset.rm,1); renderNovos(); changed(); return; }
  if(t.id==='btn-enviar') enviar();
  if(t.id==='btn-copiar') copiar();
  if(t.id==='btn-baixar') baixar();
  if(t.id==='btn-csv') baixarCsv();
});
document.addEventListener('input', e=>{ const el=e.target; if(el.dataset && el.dataset.k && !el.dataset.v){ setP(el.dataset.k, el.value); changed(); } });
document.addEventListener('change', e=>{ const el=e.target; if(el.tagName==='SELECT' && el.dataset.k){ setP(el.dataset.k, el.value); changed(); } });

/* ---------- envio ---------- */
function status(msg,cls=''){ const s=document.getElementById('envio-status'); if(s){ s.className='status '+cls; s.textContent=msg; } }
function faltando(){ const f=[]; if(!R.ident.nome.trim()) f.push('nome'); if(!R.ident.inst.trim()) f.push('instituição'); if(!R.ident.camara) f.push('Câmara Técnica'); return f; }
async function enviar(){
  const f=faltando(); if(f.length){ status('Preencha na Apresentação: '+f.join(', ')+'.','err'); return; }
  if(!/^https:\/\/script\.google\.com\//.test(ENDPOINT)){ status('O envio ainda não foi configurado. Use “Copiar respostas em texto” e envie à equipe da SEPLAN.','err'); return; }
  const hp=document.getElementById('hp');
  const b=document.getElementById('btn-enviar'); b.disabled=true; status('Enviando…');
  const ds=Object.values(R.d||{});
  const payload={id:RID, hp:hp?hp.value:'', enviadoEm:new Date().toISOString(), resposta:R, itens:itensDe(R),
    resumo:{desafios:ds.filter(x=>x.av).length, diretrizes:ds.reduce((s,x)=>s+Object.values(x.dir||{}).filter(z=>z.a).length,0), novos:(R.novos||[]).filter(n=>n.t).length}};
  const tentar=async()=>{ const res=await fetch(ENDPOINT,{method:'POST',body:JSON.stringify(payload)}); const j=await res.json(); if(!j.ok) throw new Error(j.erro||'recusado'); };
  try{ await tentar(); }
  catch(e1){
    try{ await new Promise(r=>setTimeout(r,1200)); await tentar(); }
    catch(e2){ b.disabled=false; status('Não foi possível enviar agora. Verifique a internet e tente de novo, ou use “Copiar respostas em texto” e envie por e-mail.','err'); return; }
  }
  b.disabled=false; sentAt=payload.enviadoEm; try{ localStorage.setItem('consulta-ma2050-enviado',sentAt); }catch(e){}
  status('Respostas enviadas em '+new Date(sentAt).toLocaleString('pt-BR')+'. Você pode editar e reenviar neste mesmo navegador: o novo envio substitui o anterior.','ok');
  envioLead();
}
async function copiar(){
  const t=asText();
  try{ await navigator.clipboard.writeText(t); status('Respostas copiadas. Cole no e-mail para a equipe da SEPLAN.','ok'); }
  catch(e){ const ta=document.getElementById('copia-fallback'); ta.hidden=false; ta.value=t; ta.focus(); ta.select(); status('Selecionamos o texto abaixo. Use Ctrl+C (ou Copiar) para copiar.'); }
}
async function baixar(){
  const nome=(R.ident.inst||'respostas').replace(/[^\w\-]+/g,'_').slice(0,40);
  const url=URL.createObjectURL(new Blob([asText()],{type:'text/plain;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=`consulta_ma2050_${nome}.txt`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); status('Arquivo baixado.','ok');
}
async function baixarCsv(){
  const s=document.getElementById('c-status');
  if(!downloads){ s.textContent='Download indisponível nesta visualização.'; return; }
  try{ await downloads.save({filename:'consolidacao_consulta_ma2050.csv',data:csv()}); s.className='status ok'; s.textContent='Planilha salva.'; }
  catch(e){ if(e.code!=='declined'){ s.className='status err'; s.textContent='Não foi possível salvar a planilha.'; } }
}
function envioLead(){
  const el=document.getElementById('envio-lead'); if(!el) return;
  el.textContent = sentAt ? `Você enviou em ${new Date(sentAt).toLocaleString('pt-BR')}. Um novo envio feito neste navegador substitui o anterior.` : 'Ao enviar, suas respostas vão direto para a equipe da SEPLAN. Você pode reenviar depois, neste mesmo navegador, para corrigir.';
  const bb=document.getElementById('btn-baixar'); if(bb) bb.hidden=false;
}

/* ---------- roteamento ---------- */
function show(){
  const v=current(), app=document.getElementById('app');
  if(v==='consolidacao' && !isAdmin){ location.hash='inicio'; return; }
  app.innerHTML = v==='inicio'?vInicio(): v==='lacunas'?vLacunas(): v==='envio'?vEnvio(): v==='consolidacao'?vConsol(): vArea(v);
  if(v==='lacunas') renderNovos();
  hydrate(app); updateCounts(); markTab();
  if(v==='envio') envioLead();
  if(v==='consolidacao') startConsol();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', show);
renderTabs(); show();

})();
</script>
